<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Extensiones - Mihon</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --badge: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 680px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: var(--subtext);
            margin-bottom: 20px;
        }
        .hero-action {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #334155;
            text-align: center;
        }
        .btn-add-mihon {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
            margin-bottom: 12px;
        }
        .btn-add-mihon:hover {
            background: var(--primary-hover);
        }
        .copy-box {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        input.repo-url {
            background: #090d16;
            border: 1px solid #334155;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            width: 80%;
            font-family: monospace;
            font-size: 13px;
        }
        .btn-copy {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-copy:hover {
            background: #475569;
        }
        .card {
            display: flex;
            align-items: center;
            background: var(--surface);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            gap: 15px;
            border: 1px solid #334155;
        }
        .ext-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
        }
        .ext-icon-placeholder {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            border-radius: 8px;
            font-size: 24px;
        }
        .card-info {
            flex: 1;
        }
        .card-info h3 {
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            font-size: 11px;
            background: var(--badge);
            padding: 2px 6px;
            border-radius: 4px;
            color: #cbd5e1;
        }
        .pkg {
            font-size: 12px;
            color: var(--subtext);
            font-family: monospace;
        }
        .version {
            font-size: 13px;
            color: #a5b4fc;
            margin-top: 2px;
        }
        .btn-download {
            background: #334155;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-download:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Repositorio de Extensiones</h1>
            <p class="subtitle">Compatible con Mihon, Tachiyomi y sus forks</p>
        </header>

        <div class="hero-action">
            <a href="#" id="addRepoBtn" class="btn-add-mihon">📲 Añadir a Mihon</a>
            <p style="font-size: 13px; color: var(--subtext);">O copia esta URL y pégala en <b>Ajustes > Explorar > Repositorios de extensiones</b>:</p>
            <div class="copy-box">
                <input type="text" id="repoUrl" class="repo-url" readonly value="" />
                <button class="btn-copy" onclick="copyUrl()">Copiar</button>
            </div>
        </div>

        <h2 style="font-size: 20px; margin-bottom: 15px;">Extensiones disponibles (1)</h2>
        <div class="list">
            
    <div class="card">
        <img src="icon/eu.kanade.tachiyomi.extension.es.manhwashot.png" alt="ManhwaShot" class="ext-icon" />
        <div class="card-info">
            <h3>ManhwaShot <span class="badge">ES</span></h3>
            <p class="pkg">eu.kanade.tachiyomi.extension.es.manhwashot</p>
            <p class="version">v1.6.1</p>
        </div>
        <a href="apk/tachiyomi-es.manhwashot-v1.6.1.apk" class="btn-download">Descargar APK</a>
    </div>
    
        </div>
    </div>

    <script>
        const currentUrl = window.location.href.split('?')[0].split('#')[0];
        const indexUrl = currentUrl.endsWith('/') ? currentUrl + 'index.min.json' : currentUrl.replace(/[^/]+$/, 'index.min.json');
        document.getElementById('repoUrl').value = indexUrl;
        document.getElementById('addRepoBtn').href = 'mihon://add-repo?url=' + encodeURIComponent(indexUrl);

        function copyUrl() {
            const input = document.getElementById('repoUrl');
            navigator.clipboard.writeText(input.value);
            alert('¡URL del repositorio copiada al portapapeles!');
        }
    </script>
</body>
</html>
